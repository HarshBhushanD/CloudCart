apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: cloudcart
spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service
          image: cloudcart-order-service:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5003

          env:
            - name: PORT
              value: "5003"

            - name: DB_USER
              value: "postgres"

            - name: DB_HOST
              value: "postgres-order"

            - name: DB_NAME
              value: "cloudcart_orders"

            - name: DB_PASSWORD
              value: "password"

            - name: DB_PORT
              value: "5432"

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudcart-secrets
                  key: JWT_SECRET

            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:5002"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 5
            periodSeconds: 5