apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: cloudcart
spec:
  replicas: 2

  selector:
    matchLabels:
      app: product-service

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: product-service

    spec:
      containers:
        - name: product-service

          image: harshbhushandixit/cloudcart-product:5

          ports:
            - containerPort: 5002

          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: cloudcart-config
                  key: PRODUCT_PORT

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: cloudcart-config
                  key: DB_USER

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: cloudcart-config
                  key: PRODUCT_DB_HOST

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: cloudcart-config
                  key: PRODUCT_DB_NAME

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: cloudcart-config
                  key: DB_PORT

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudcart-secrets
                  key: POSTGRES_PASSWORD

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 5