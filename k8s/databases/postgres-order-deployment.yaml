apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-order
  namespace: cloudcart
spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres-order

  template:
    metadata:
      labels:
        app: postgres-order

    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              value: "postgres"

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudcart-secrets
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              value: "cloudcart_orders"

          volumeMounts:
            - name: postgres-order-storage
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U postgres -d cloudcart_orders
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U postgres -d cloudcart_orders
            initialDelaySeconds: 15
            periodSeconds: 10

      volumes:
        - name: postgres-order-storage
          persistentVolumeClaim:
             claimName: postgres-order-pvc